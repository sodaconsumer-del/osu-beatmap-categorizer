name: Build standalone executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# Default GITHUB_TOKEN is read-only unless a repo/org setting overrides it.
# softprops/action-gh-release needs write access to create the release and
# attach the zip - without this, that step fails with "Resource not
# accessible by integration" even though everything up to it succeeds.
permissions:
  contents: write

jobs:
  test:
    # Runs on every build. The classifier is a pile of tuned heuristics, so a
    # refactor that quietly breaks one is entirely possible - catching that
    # before a release goes out is the whole point.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run classifier tests
        run: python test_classify.py

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build main GUI executable
        run: pyinstaller --onefile --windowed --name osu-beatmap-categorizer gui.py

      - name: Build realm-reader helper
        # The tool still works without this - classify_maps.py falls back to a
        # filesystem scan - so a failure here shouldn't sink the whole build.
        # But a release that silently ships without it looks exactly like the
        # helper being broken, so the check below turns that into a hard
        # failure for tagged builds specifically.
        continue-on-error: true
        run: >
          dotnet publish realm-reader/RealmReader.csproj -c Release
          -r win-x64 --self-contained true
          -o realm-reader-dist

      - name: Assemble release folder
        shell: bash
        run: |
          mkdir -p release
          cp dist/osu-beatmap-categorizer.exe release/
          cp README.md release/ || true
          # The self-contained .NET publish is ~190 files and ~76MB of runtime
          # DLLs. Dumping those next to the GUI exe makes the folder unusable -
          # you can't find the thing you're meant to double-click. They go in a
          # subfolder instead, which default_realm_reader_path() already looks
          # in, so this needs no code change.
          if [ -f realm-reader-dist/realm-reader.exe ]; then
            mkdir -p release/realm-reader
            cp -r realm-reader-dist/. release/realm-reader/
            echo "helper bundled: $(ls release/realm-reader | wc -l) files"
          else
            echo "::warning::realm-reader helper missing - the app will fall back to the slower filesystem scan"
          fi

      - name: Require the helper for tagged releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [ ! -f release/realm-reader/realm-reader.exe ]; then
            echo "::error::realm-reader.exe is missing. A release without it is a huge silent" \
                 "downgrade for lazer users (minutes-long filesystem scan instead of seconds)." \
                 "Fix the publish step rather than shipping this."
            exit 1
          fi

      - name: Upload artifact
        # actions/upload-artifact zips whatever path is given when you
        # download it from the Actions UI - pointing this at the raw
        # release/ folder (rather than a zip we made ourselves) means you
        # get a single zip on download, not a zip-inside-a-zip.
        uses: actions/upload-artifact@v4
        with:
          name: osu-beatmap-categorizer-windows
          path: release/

      - name: Zip release folder for GitHub Release attachment
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path release/* -DestinationPath osu-beatmap-categorizer-windows.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: osu-beatmap-categorizer-windows.zip
